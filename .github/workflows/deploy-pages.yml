name: Publicar Eco Estelar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del sitio
        run: |
          mkdir site
          cp index.html style.css script.js manifest.webmanifest icon.svg sw.js site/
          touch site/.nojekyll

      - name: Subir sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
